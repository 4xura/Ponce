name: Windows IDA 9.4
on:
  workflow_dispatch:
  push:
    branches: [ida-9.4]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ponce-win94-${{ hashFiles('scripts/dependencies.json', 'cmake/triplets/*') }}
      - name: Build against pinned public IDA 9.4 SDK
        shell: pwsh
        run: ./scripts/build-ida94.ps1 -Parallel 4
      - name: Package DLL and dependency licenses
        shell: pwsh
        run: ./scripts/package-ida94.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Ponce-IDA-9.4-Windows
          path: dist/Ponce-IDA-9.4-Windows.zip
          if-no-files-found: error
